<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Blox Fruits Giveaway</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <h1>Giveaway Registration</h1>
    <p>Complete all steps to enter the Blox Fruits giveaway</p>

    <!-- STEP 1: Roblox Username -->
    <input
      type="text"
      id="robloxUsername"
      placeholder="Enter your Roblox username"
    >

    <!-- STEP 2: Subscribe -->
    <button class="icon-btn yt" onclick="subscribe()">
      <i class="fab fa-youtube"></i>
      Subscribe to Channel
    </button>

    <label class="check hidden" id="subBox">
      <input type="checkbox" id="subCheck">
      I have subscribed
    </label>

    <!-- STEP 3: Join Discord -->
    <button class="icon-btn dc" onclick="join()">
      <i class="fab fa-discord"></i>
      Join Discord
    </button>

    <label class="check hidden" id="discordBox">
      <input type="checkbox" id="discordCheck">
      I have joined the Discord
    </label>

    <!-- FINAL STEP -->
    <button id="registerBtn" disabled onclick="registerUser()">
      🎁 Register for Giveaway
    </button>

    <p id="errorMsg"></p>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
